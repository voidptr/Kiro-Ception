[project]
name = "kiro-ception"
version = "1.0.9"
description = "Semantic search across Kiro CLI, Kiro IDE, and Claude Code conversation history"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Farley Farley" }]
keywords = ["kiro", "claude", "claude-code", "mcp", "semantic-search", "conversation-history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.26.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "filelock>=3.0.0",
    "requests>=2.28.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.0",
]

[project.urls]
Homepage = "https://github.com/DevOps-Nirvana/Kiro-Ception"
Repository = "https://github.com/DevOps-Nirvana/Kiro-Ception"

[project.scripts]
kiro-ception = "kiro_ception.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_ception"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/kiro_ception/"]


[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mutmut>=3.6.0",
    "pytest>=9.0.3",
]
